name: Add issue to project and set fields

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - name: Add to project
        uses: actions/add-to-project@v1.0.2
        id: add-project
        with:
          project-url: https://github.com/orgs/ScottyLabs/projects/29
          github-token: ${{ secrets.PROJECT_TOKEN }}

      - name: Parse issue body fields
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';

            const extract = (label) => {
              const regex = new RegExp(`### ${label}\\s*\\n([^#]+)`);
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            };

            // Single-select fields
            core.setOutput('size', extract('Size'));
            core.setOutput('priority', extract('Priority'));
            core.setOutput('status', extract('Status'));

            // Multi-select: parse checked checkboxes
            const labelBlock = extract('Labels');
            const selectedLabels = labelBlock
              ? labelBlock
                  .split('\n')
                  .filter(l => /- \[x\]/i.test(l))
                  .map(l => l.replace(/- \[x\]\s*/i, '').trim())
              : [];

            core.setOutput('labels', JSON.stringify(selectedLabels));

      - name: Apply labels to issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = JSON.parse('${{ steps.parse.outputs.labels }}');
            if (labels.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels
            });

      - name: Set project fields
        uses: actions/github-script@v7
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = 'PVT_kwDOABVDIs4BSat4';
            const itemId = '${{ steps.add-project.outputs.itemId }}';

            const fields = [
              { key: 'size',     id: 'PVTSSF_lADOABVDIs4BSat4zhTK4Jk',     value: `${{ steps.parse.outputs.size }}`     },
              { key: 'priority', id: 'PVTSSF_lADOABVDIs4BSat4zhTK5W0', value: `${{ steps.parse.outputs.priority }}` },
              { key: 'status',   id: 'PVTSSF_lADOABVDIs4BSat4zg_9TB4',   value: `${{ steps.parse.outputs.status }}`   },
            ];

            // Map option name -> option ID for each field
            // You need to pre-fetch these from the GraphQL query and hardcode them
            const optionIds = {
              size:     { XS: 'f8c9eb8d', S: '9e524637', M: '3d0cbef0', L: '07cb9fa6', XL: '85020eef' },
              priority: { P0: '40124670', P1: '909de03f', P2: '4eff8157' },
              status:   { Ready: '43db0367', 'In progress': '47fc9ee4', Backlog: 'f75ad846', Done: '98236657' },
            };

            for (const field of fields) {
              if (!field.value) continue;
              const optionId = optionIds[field.key][field.value];
              if (!optionId) continue;

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId, fieldId: field.id, optionId });
            }
