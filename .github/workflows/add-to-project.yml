name: Add issue to project and set fields

on:
  issues:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Parse issue body and add to project
        id: parse
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';

            const extract = (label) => {
              const regex = new RegExp(`### ${label}\\s*\\n([^#]+)`);
              const match = body.match(regex);
              return match ? match[1].trim() : null;
            };

            // Single-select fields
            core.setOutput('size', extract('Size'));
            core.setOutput('priority', extract('Priority'));
            core.setOutput('status', extract('Status'));

            // Multi-select: parse checked checkboxes
            const labelBlock = extract('Label');
            const selectedLabels = labelBlock
              ? labelBlock
                  .split('\n')
                  .filter(l => /- \[x\]/i.test(l))
                  .map(l => l.replace(/- \[x\]\s*/i, '').trim())
              : [];
            core.setOutput('labels', JSON.stringify(selectedLabels));

            // Add issue to ProjectV2 and return the item ID
            const issueNodeId = context.payload.issue.node_id;
            const projectId = 'PVT_kwDOABVDIs4BSat4';

            const { addProjectV2ItemById } = await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: {
                  projectId: $projectId
                  contentId: $contentId
                }) { item { id } }
              }
            `, { projectId, contentId: issueNodeId });

            core.setOutput('itemId', addProjectV2ItemById.item.id);

      - name: Apply labels to issue
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = JSON.parse('${{ steps.parse.outputs.labels }}');
            if (labels.length === 0) return;

            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              labels
            });

      - name: Set project fields
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId = 'PVT_kwDOABVDIs4BSat4';
            const itemId = '${{ steps.parse.outputs.itemId }}';

            const fields = [
              { key: 'size', id: 'PVTSSF_lADOABVDIs4BSat4zhTK4Jk', value: `${{ steps.parse.outputs.size }}`},
              { key: 'priority', id: 'PVTSSF_lADOABVDIs4BSat4zhTK5W0', value: `${{ steps.parse.outputs.priority }}`},
              { key: 'status', id: 'PVTSSF_lADOABVDIs4BSat4zg_9TB4', value: `${{ steps.parse.outputs.status }}`},
            ];

            const optionIds = {
              size: { XS: 'f8c9eb8d', S: '9e524637', M: '3d0cbef0', L: '07cb9fa6', XL: '85020eef' },
              priority: { P0: '40124670', P1: '909de03f', P2: '4eff8157' },
              status: { Ready: '43db0367', 'In progress': '47fc9ee4', Backlog: 'f75ad846', Done: '98236657' },
            };

            for (const field of fields) {
              if (!field.value) continue;
              const optionId = optionIds[field.key][field.value];
              if (!optionId) continue;

              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId
                    itemId: $itemId
                    fieldId: $fieldId
                    value: { singleSelectOptionId: $optionId }
                  }) { projectV2Item { id } }
                }
              `, { projectId, itemId, fieldId: field.id, optionId });
            }

      - name: Clean up issue body
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = context.payload.issue.body || '';

            const extract = (label) => {
                          const escapeRegex = (value) => value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                          const sectionLabels = ['Overall Objective', 'Suggested Approach', 'Help & Resources', 'Size', 'Priority', 'Status', 'Label'];
                          const nextSections = sectionLabels.filter((section) => section !== label).map(escapeRegex).join('|');
                          const regex = new RegExp(`(?:^|\\n)### ${escapeRegex(label)}\\s*\\n([\\s\\S]*?)(?=\\n### (?:${nextSections})\\s*\\n|$)`);
                          const match = body.match(regex);
                          return match ? match[1].trim() : null;
                        };

                        const objective = extract('Overall Objective');
                        const approach  = extract('Suggested Approach');

            if (!objective && !approach) {
                          return;
                        }

                        const cleaned = [
                          objective && `### Overall Objective\n${objective}`,
                          approach  && `### Suggested Approach\n${approach}`,
                        ].filter(Boolean).join('\n\n');

                        await github.rest.issues.update({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.payload.issue.number,
                          body: cleaned,
                        });