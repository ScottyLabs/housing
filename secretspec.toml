[project]
name = "housing"
revision = "1.0"

[providers]
local = "dotenv://.env"
vault = "vault://secrets.scottylabs.org/secret"

[profiles.ci.defaults]
required = false

[profiles.default]
KEYCLOAK_URL = { description = "Keycloak base URL" }
KEYCLOAK_REALM = { description = "Keycloak realm name" }
OIDC_CLIENT_ID = { description = "OIDC client ID" }
OIDC_CLIENT_SECRET = { description = "OIDC client secret" }
OAUTH_RELAY_URL = { description = "OAuth relay callback URL" }
PROJECT_GROUP = { description = "Keycloak project group path" }
PROJECT_ADMIN_GROUP = { description = "Keycloak project admin group path" }

[profiles.prod]
SENTRY_DSN = { description = "Sentry DSN for error reporting", required = false }
OIDC_ISSUER = { description = "Keycloak issuer URL", default = "https://idp.scottylabs.org/realms/scottylabs" }
APP_BASE_URL = { description = "Public API base URL", required = true }
FRONTEND_URL = { description = "Public frontend URL", required = true }
CORS_ORIGINS = { description = "Comma-separated allowed CORS origins", required = true }

[profiles.staging]
OIDC_ISSUER = { description = "Keycloak issuer URL", default = "https://idp.scottylabs.org/realms/scottylabs" }
APP_BASE_URL = { description = "Staging API base URL", required = true }
FRONTEND_URL = { description = "Staging frontend URL", required = true }
CORS_ORIGINS = { description = "Comma-separated allowed CORS origins", required = true }

[profiles.preview]
OIDC_ISSUER = { description = "Keycloak issuer URL", default = "https://idp.scottylabs.org/realms/scottylabs" }
APP_BASE_URL = { description = "Preview API base URL", required = true }
FRONTEND_URL = { description = "Preview frontend URL", required = true }
CORS_ORIGINS = { description = "Comma-separated allowed CORS origins", required = true }

[profiles.dev.defaults]
providers = ["vault"]

[profiles.dev]
