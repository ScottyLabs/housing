name: Label issue fields on open

on:
  issues:
    types: [opened]

jobs:
  label-and-board:
    runs-on: codeberg-small

    env:
      CODEBERG_API: https://codeberg.org/api/v1
      REPO_OWNER: "ScottyLabs"
      REPO_NAME:  "housing"

    steps:
      # Parse fields and apply labels
      - name: Parse and label issue
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          set -euo pipefail

          # Extract the value under a ### Heading (first non-empty line after it)
          extract() {
            echo "$ISSUE_BODY" | awk "/^### $1/{found=1; next} found && /\S/{print; exit} found && /^###/{exit}" 
          }

          SIZE=$(extract "Size")
          PRIORITY=$(extract "Priority")
          STATUS=$(extract "Status")

          echo "Parsed → size=$SIZE priority=$PRIORITY status=$STATUS"

          # Parse checked checkboxes: lines matching "- [x] label"
          LABEL_BLOCK=$(echo "$ISSUE_BODY" | awk '/^### Labels?/{found=1; next} found && /^###/{exit} found{print}')
          mapfile -t CAT_LABELS < <(echo "$LABEL_BLOCK" | grep -iE '^\s*- \[x\]' | sed -E 's/^\s*- \[x\]\s*//i' | xargs)

          echo "Category labels: ${CAT_LABELS[*]:-none}"

          # Build the labels array
          labels=()
          [ -n "$SIZE" ] && labels+=("$SIZE")
          [ -n "$PRIORITY" ] && labels+=("$PRIORITY")
          [ -n "$STATUS" ] && labels+=("$STATUS")
          for lbl in "${CAT_LABELS[@]}"; do
            [ -n "$lbl" ] && labels+=("$lbl")
          done

          if [ ${#labels[@]} -eq 0 ]; then
            echo "No labels to apply — skipping."
            exit 0
          fi

          # Build JSON payload and apply labels
          payload=$(printf '%s\n' "${labels[@]}" | jq -Rsc 'split("\n") | map(select(length > 0)) | {labels: .}')
          echo "Applying labels: $payload"

          curl -fsSL \
            -X POST \
            -H "Authorization: token $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$CODEBERG_API/repos/$REPO_OWNER/$REPO_NAME/issues/$ISSUE_NUMBER/labels"