name: PR size

on:
  pull_request:
    types: [opened, reopened, synchronize]

defaults:
  run:
    shell: bash

jobs:
  size:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: native

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Debug label POST
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -uo pipefail
          URL="$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels"
          echo "URL=$URL"
          curl --version | head -1
          echo "token length: ${#FORGE_TOKEN}"
          case "$FORGE_TOKEN" in
            *[[:space:]]*) echo "WARNING: token contains whitespace" ;;
            *) echo "token has no whitespace" ;;
          esac

          redact() {
            local l
            while IFS= read -r l; do
              case "$l" in
                *uthorization*) echo "${l%%:*}: <redacted>" ;;
                *) echo "$l" ;;
              esac
            done
          }

          echo "=== v1: -H Content-Type + -d ==="
          curl -sS -o /tmp/v1 -w 'HTTP %{http_code}\n' -X POST \
            -H "Authorization: token $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"labels":[30]}' "$URL" || echo "curl exit $?"
          cat /tmp/v1; echo

          echo "=== v2: --json (needs curl 7.82+, ignore if unknown option) ==="
          curl -sS -o /tmp/v2 -w 'HTTP %{http_code}\n' \
            -H "Authorization: token $FORGE_TOKEN" \
            --json '{"labels":[30]}' "$URL" || echo "curl exit $?"
          cat /tmp/v2; echo

          echo "=== v3: --data-binary + --header ==="
          curl -sS -o /tmp/v3 -w 'HTTP %{http_code}\n' -X POST \
            --header "Authorization: token $FORGE_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary '{"labels":[30]}' "$URL" || echo "curl exit $?"
          cat /tmp/v3; echo

          echo "=== v5: no -X, -d implies POST ==="
          curl -sS -o /tmp/v5 -w 'HTTP %{http_code}\n' \
            -H "Authorization: token $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"labels":[30]}' "$URL" || echo "curl exit $?"
          cat /tmp/v5; echo

          echo "=== v6: GET for comparison ==="
          curl -sS -o /tmp/v6 -w 'HTTP %{http_code}\n' \
            -H "Authorization: token $FORGE_TOKEN" \
            "$GITHUB_SERVER_URL/api/v1/repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" || echo "curl exit $?"
          cat /tmp/v6; echo

          echo "=== v4: verbose trace of v1 ==="
          curl -sS -v -X POST \
            -H "Authorization: token $FORGE_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"labels":[30]}' "$URL" 2>&1 | redact
          echo "=== end debug ==="

      - name: Measure and label
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          source .forgejo/scripts/forge-lib.sh

          diff_file="${RUNNER_TEMP:-/tmp}/pr_${PR_NUMBER}.diff"
          api GET "/pulls/$PR_NUMBER.diff" > "$diff_file"

          skip=0 changed=0 skipped=0
          while IFS= read -r line || [ -n "$line" ]; do
            case "$line" in
              'diff --git '*)
                path="${line##* b/}"
                skip=0
                case "$path" in
                  *.lock|*/*.lock|deno.lock|node_modules/*|*/node_modules/*|\
                  *openapi.json|*.snap|*.min.js|*.min.css|*.svg|*.png|*.jpg|*.ico)
                    skip=1 ;;
                esac
                [ "$skip" -eq 1 ] && skipped=$((skipped + 1))
                continue ;;
              '+++'*|'---'*) continue ;;
            esac
            [ "$skip" -eq 1 ] && continue
            case "$line" in
              '+'*|'-'*) changed=$((changed + 1)) ;;
            esac
          done < "$diff_file"
          rm -f "$diff_file"

          if   [ "$changed" -lt 10  ]; then size="size/XS"
          elif [ "$changed" -lt 50  ]; then size="size/S"
          elif [ "$changed" -lt 200 ]; then size="size/M"
          elif [ "$changed" -lt 600 ]; then size="size/L"
          else                              size="size/XL"
          fi

          echo "PR #$PR_NUMBER: $changed changed lines ($skipped generated files ignored) -> $size"
          set_exclusive_label "$PR_NUMBER" "size/" "$size"
