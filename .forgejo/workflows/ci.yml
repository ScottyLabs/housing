name: CI

on:
  push:
    branches: [main, staging, dev]
  pull_request:

jobs:
  checks:
    uses: ScottyLabs/kennel/.forgejo/workflows/checks.yml@main

  check-openapi:
    runs-on: native
    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7

      - name: Check openapi.json freshness
        run: |
          nix develop --command sh -c 'cd apps/backend && deno task openapi'
          nix fmt apps/frontend/src/api/openapi.json
          git diff --exit-code apps/frontend/src/api/openapi.json || (echo "::error::openapi.json is out of date" && exit 1)
