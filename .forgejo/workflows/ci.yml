name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6
  checks:
    runs-on: docker
    steps:
      - name: Checkout
        uses: https://code.forgejo.org/actions/checkout@v6

      - name: Setup Deno
        uses: https://github.com/denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-dependency-path: apps/frontend/deno.lock

      - name: Install dependencies
        working-directory: apps/frontend
        run: deno install --frozen

      - name: Build
        working-directory: apps/frontend
        run: deno run build
