name: Stale nudge

on:
  schedule:
    - cron: "0 7 * * *" # 03:00 ET
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List what would happen, change nothing"
        type: boolean
        default: true

defaults:
  run:
    shell: bash

jobs:
  nudge:
    runs-on: native

    env:
      STALE_DAYS: "21"
      DRY_RUN: ${{ github.event.inputs.dry_run }}

    steps:
      - uses: https://code.forgejo.org/actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Nudge
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_TOKEN }}
        run: |
          set -euo pipefail
          source .forgejo/scripts/forge-lib.sh

          dry() { [ "${DRY_RUN:-false}" = "true" ]; }

          # bash-native date math - no `date` binary needed
          export TZ=UTC
          printf -v now '%(%s)T' -1
          printf -v cutoff '%(%Y-%m-%dT%H:%M:%SZ)T' $(( now - STALE_DAYS * 86400 ))
          echo "Anything open and untouched since $cutoff is stale."
          dry && echo "DRY RUN - no changes will be made."

          handle() { # handle <number> <kind>
            local number="$1" kind="$2"
            if issue_has_label "$number" "no-stale" \
              || issue_has_label "$number" "stage/backlog"; then
              echo "#$number: exempt, skipping"
              return 0
            fi

            if issue_has_label "$number" "stale"; then
              echo "#$number: stale again -> unassigning"
              dry && return 0
              comment_on_issue "$number" \
                "Still no movement, so I'm unassigning this and putting it back up for grabs. Comment here if you're still on it and want it back."
              api PATCH "/issues/$number" '{"assignees":[]}' > /dev/null
              [ "$kind" = "issue" ] && set_exclusive_label "$number" "stage/" "stage/ready"
              return 0
            fi

            echo "#$number: marking stale"
            dry && return 0
            comment_on_issue "$number" \
              "No activity here for ${STALE_DAYS} days. If this is still live, drop a comment or push something and I'll clear the label. Otherwise it'll be unassigned on the next sweep."
            add_labels "$number" "stale"
          }

          for kind in issues pulls; do
            list="$(api GET "/issues?state=open&type=$kind&before=$cutoff&limit=50")"
            mapfile -t numbers < <(json_numbers "$list" number)
            echo "== $kind: ${#numbers[@]} stale =="
            singular="issue"; [ "$kind" = "pulls" ] && singular="pull"
            for n in "${numbers[@]}"; do
              handle "$n" "$singular"
            done
          done
