labels:
  - name: "stage/ready"
    color: "#0e8a16"
    description: "Unassigned and ready for someone to pick up"
  - name: "stage/in-progress"
    color: "#1d76db"
    description: "Someone is assigned and working on it"
  - name: "stage/backlog"
    color: "#c5def5"
    description: "Parked on purpose - not up for grabs yet"
  - name: "stage/done"
    color: "#5319e7"
    description: "Closed"

  - name: "size/XS"
    color: "#e6f5d0"
    description: "Under 10 changed lines"
  - name: "size/S"
    color: "#c2e88a"
    description: "Under 50 changed lines"
  - name: "size/M"
    color: "#fbca04"
    description: "Under 200 changed lines"
  - name: "size/L"
    color: "#f4a24c"
    description: "Under 600 changed lines"
  - name: "size/XL"
    color: "#d93f0b"
    description: "600+ changed lines - consider splitting it"

  - name: "priority/high"
    color: "#b60205"
    description: "Blocking or time-sensitive"
  - name: "priority/medium"
    color: "#e99695"
    description: "Normal priority"
  - name: "priority/low"
    color: "#f9d0c4"
    description: "Nice to have"

  - name: "bug"
    color: "#d73a4a"
    description: "Something isn't working"
  - name: "enhancement"
    color: "#a2eeef"
    description: "New feature or request"
  - name: "chore"
    color: "#cfd3d7"
    description: "Maintenance, tooling, dependencies"
  - name: "documentation"
    color: "#0075ca"
    description: "Docs and READMEs"
  - name: "beginner friendly"
    color: "#7057ff"
    description: "Good first issue for a new member"
  - name: "wontfix"
    color: "#ffffff"
    description: "This will not be worked on"

  - name: "backend"
    color: "#5319e7"
    description: "apps/backend"
  - name: "frontend"
    color: "#006b75"
    description: "apps/frontend"

  # --- process ---
  - name: "needs-triage"
    color: "#ededed"
    description: "Not yet sized, prioritised or staged"
  - name: "stale"
    color: "#795548"
    description: "No activity for a while - applied by stale.yml"
  - name: "no-stale"
    color: "#bfd4f2"
    description: "Exempt from the stale nudge"
